<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon-16x16.png" type="image/png" />
  <title>Live Map · Breakaway Timing</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #000; --white: #fff; --green: #00e676;
      --mid: #888; --border: #333; --surface: #111;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    html, body { height: 100%; background: var(--black); color: var(--white); font-family: var(--font); }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.5rem;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .live-badge {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--green);
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .rider-count { font-size: 0.75rem; color: var(--mid); }

    /* ── Map ── */
    #map { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; }

    /* ── Rider panel ── */
    .rider-panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
      background: rgba(0,0,0,0.92);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 50vh;
      overflow-y: auto;
    }
    .rider-panel.open { transform: translateY(0); }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(0,0,0,0.95);
    }
    .panel-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); }
    .panel-close { background: none; border: none; color: var(--mid); font-size: 1.2rem; cursor: pointer; padding: 0 0.25rem; }
    .riders-list { padding: 0.5rem 0; }
    .rider-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.15s;
    }
    .rider-row:hover { background: #0d0d0d; }
    .rider-bib {
      width: 40px; height: 40px; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
      color: var(--white);
    }
    .rider-info { flex: 1; }
    .rider-name { font-size: 0.9rem; font-weight: 600; }
    .rider-meta { font-size: 0.75rem; color: var(--mid); margin-top: 0.15rem; }
    .rider-status { font-size: 0.7rem; }
    .rider-status.fresh { color: var(--green); }
    .rider-status.stale { color: var(--amber, #ffab00); }
    .rider-status.old   { color: #ff6666; }

    /* ── Leaflet custom markers ── */
    .rider-marker {
      background: #00e676; border: 2px solid #000;
      border-radius: 50%; width: 14px; height: 14px;
    }
    .rider-marker.stale { background: #ffab00; }
    .rider-marker.old   { background: #ff6666; }

    /* ── Leaflet dark map override ── */
    .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
    .leaflet-container { background: #000; }
    .leaflet-popup-content-wrapper { background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; box-shadow: none; }
    .leaflet-popup-tip { background: #111; }
    .leaflet-popup-close-button { color: #888 !important; }

    /* ── Bottom list toggle ── */
    .list-toggle {
      position: fixed; bottom: 1rem; right: 1rem; z-index: 1001;
      background: var(--white); color: var(--black);
      border: none; border-radius: 999px;
      font-family: var(--font); font-weight: 700; font-size: 0.8rem;
      padding: 0.65rem 1.25rem;
      cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    /* ── No riders message ── */
    .no-riders {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; color: var(--mid); z-index: 500;
      pointer-events: none;
    }
    .no-riders.visible { display: block; }
    .no-riders h2 { font-size: 1.2rem; font-weight: 600; color: var(--white); }
    .no-riders p  { font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">Breakaway Timing</a>
    <div class="nav-right">
      <span class="live-badge"><span class="live-dot"></span>Live</span>
      <span class="rider-count" id="riderCount">0 riders</span>
    </div>
  </nav>

  <div id="map"></div>

  <div class="no-riders" id="noRiders">
    <h2>No active riders</h2>
    <p>Riders will appear here once they start tracking.</p>
  </div>

  <button class="list-toggle" id="listToggle">All Riders ↑</button>

  <div class="rider-panel" id="riderPanel">
    <div class="panel-header">
      <span class="panel-title">Active Riders</span>
      <button class="panel-close" id="panelClose">✕</button>
    </div>
    <div class="riders-list" id="ridersList"></div>
  </div>

  <!-- Firebase + Leaflet -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════════════
    // CONFIGURATION — match your tracker.html config
    // ════════════════════════════════════════════════════════════════════════
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyCWwav2Ytr1wKSPevsxKYlYb6h6RNWJ5Rc",
      authDomain:        "breakaway-live-tracking.firebaseapp.com",
      databaseURL:       "https://breakaway-live-tracking-default-rtdb.firebaseio.com",
      projectId:         "breakaway-live-tracking",
      storageBucket:     "breakaway-live-tracking.firebasestorage.app",
      messagingSenderId: "339351898110",
      appId:             "1:339351898110:web:4ab4ae53da9da04143e2af",
      measurementId:     "G-5PW1MM3L1L",
    };
    // ════════════════════════════════════════════════════════════════════════

    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    // ── Map init ─────────────────────────────────────────────────────────────
    const map = L.map('map', { zoomControl: true }).setView([37.1, -113.5], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19,
    }).addTo(map);

    // ── State ─────────────────────────────────────────────────────────────────
    const markers  = {};    // sessionId → Leaflet marker
    const riders   = {};    // sessionId → rider data
    const STALE_MS = 8 * 60 * 1000;   // >8min since ping = stale (amber)
    const OLD_MS   = 20 * 60 * 1000;  // >20min = probably offline (red)
    let mapFitted  = false;

    // ── Create custom icon ────────────────────────────────────────────────────
    function makeIcon(staleness) {
      const cls = staleness === 'old' ? 'old' : staleness === 'stale' ? 'stale' : '';
      return L.divIcon({
        className: '',
        html: `<div class="rider-marker ${cls}"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
        popupAnchor: [0, -10],
      });
    }

    function stalenessClass(timestamp) {
      if (!timestamp) return 'old';
      const age = Date.now() - timestamp;
      if (age < STALE_MS) return 'fresh';
      if (age < OLD_MS)   return 'stale';
      return 'old';
    }

    function formatAge(timestamp) {
      if (!timestamp) return 'No ping yet';
      const age = Math.floor((Date.now() - timestamp) / 60000);
      if (age < 1) return 'Just now';
      if (age === 1) return '1 min ago';
      return `${age} min ago`;
    }

    function formatExpiry(expiresAt) {
      const remaining = expiresAt - Date.now();
      if (remaining <= 0) return 'Expired';
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      return h > 0 ? `Expires in ${h}h ${m}m` : `Expires in ${m}m`;
    }

    // ── Update/add marker ─────────────────────────────────────────────────────
    function upsertRider(id, data) {
      // Skip expired or inactive
      if (!data.active || Date.now() > data.expiresAt) {
        removeRider(id);
        return;
      }

      riders[id] = data;
      const stale = stalenessClass(data.timestamp);

      if (data.lat && data.lng) {
        const latlng = [data.lat, data.lng];

        if (markers[id]) {
          markers[id].setLatLng(latlng);
          markers[id].setIcon(makeIcon(stale));
        } else {
          markers[id] = L.marker(latlng, { icon: makeIcon(stale) }).addTo(map);
          if (!mapFitted) {
            map.setView(latlng, 14);
            mapFitted = true;
          }
        }

        markers[id].bindPopup(`
          <div style="font-family:-apple-system,sans-serif;padding:4px 0;">
            <div style="font-size:1rem;font-weight:700;color:#fff;">Bib ${data.bib}</div>
            <div style="font-size:0.85rem;color:#888;margin-top:2px;">${data.name}</div>
            <div style="font-size:0.75rem;color:#888;margin-top:6px;">
              ${formatAge(data.timestamp)}
              ${data.accuracy ? ` · ±${data.accuracy}m` : ''}
            </div>
            <div style="font-size:0.7rem;color:#666;margin-top:2px;">${formatExpiry(data.expiresAt)}</div>
          </div>
        `);
      }

      updateRiderList();
      updateCount();
    }

    function removeRider(id) {
      if (markers[id]) { markers[id].remove(); delete markers[id]; }
      delete riders[id];
      updateRiderList();
      updateCount();
    }

    // ── Rider list panel ──────────────────────────────────────────────────────
    function updateRiderList() {
      const list = document.getElementById('ridersList');
      const active = Object.values(riders).filter(r => r.active && Date.now() < r.expiresAt);

      list.innerHTML = '';
      if (!active.length) {
        list.innerHTML = '<div style="padding:1.5rem;color:#666;font-size:0.85rem;">No active riders</div>';
        return;
      }

      active.sort((a, b) => parseInt(a.bib) - parseInt(b.bib)).forEach(rider => {
        const stale = stalenessClass(rider.timestamp);
        const row = document.createElement('div');
        row.className = 'rider-row';
        row.innerHTML = `
          <div class="rider-bib">${rider.bib}</div>
          <div class="rider-info">
            <div class="rider-name">${rider.name}</div>
            <div class="rider-meta">${formatAge(rider.timestamp)}${rider.accuracy ? ` · ±${rider.accuracy}m` : ''}</div>
          </div>
          <div class="rider-status ${stale}">
            ${stale === 'fresh' ? '● Live' : stale === 'stale' ? '● Stale' : '● Offline'}
          </div>
        `;
        row.addEventListener('click', () => {
          if (rider.lat && rider.lng) {
            map.setView([rider.lat, rider.lng], 15);
            markers[rider.sessionId]?.openPopup();
            riderPanel.classList.remove('open');
          }
        });
        list.appendChild(row);
      });
    }

    function updateCount() {
      const n = Object.keys(riders).length;
      document.getElementById('riderCount').textContent = `${n} rider${n !== 1 ? 's' : ''}`;
      document.getElementById('noRiders').classList.toggle('visible', n === 0);
    }

    // ── Panel toggle ──────────────────────────────────────────────────────────
    const riderPanel = document.getElementById('riderPanel');
    document.getElementById('listToggle').addEventListener('click', () => {
      riderPanel.classList.toggle('open');
    });
    document.getElementById('panelClose').addEventListener('click', () => {
      riderPanel.classList.remove('open');
    });

    // ── Firebase listener ─────────────────────────────────────────────────────
    db.ref('riders').on('value', (snap) => {
      const all = snap.val() || {};

      // Remove riders no longer in DB
      Object.keys(riders).forEach(id => { if (!all[id]) removeRider(id); });

      // Add/update
      Object.entries(all).forEach(([id, data]) => upsertRider(id, data));
    });

    // ── Periodic stale-check (refresh marker colors every minute) ────────────
    setInterval(() => {
      Object.entries(riders).forEach(([id, data]) => {
        if (markers[id]) markers[id].setIcon(makeIcon(stalenessClass(data.timestamp)));
      });
      updateRiderList();
    }, 60000);
  </script>
</body>
</html>
